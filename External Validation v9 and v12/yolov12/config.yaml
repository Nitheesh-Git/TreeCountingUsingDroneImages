# YOLOv12n comparison-model configuration.
# Training data: 594-image half subset (see common/subset_stats.md).
# Settings are identical for YOLOv9t and YOLOv12n.
model_name: YOLOv12n
pretrained: yolo12n.pt            # official Ultralytics asset (COCO-pretrained), stored in weights/ (git-ignored)
implementation: "Ultralytics integration of YOLO12 (sunsmarterjie/yolov12), nano variant"
run_name: yolov12n_half_subset

train:
  imgsz: 416
  epochs: 30
  patience: 5
  batch: 8
  device: cpu               # protocol default; override with --device 0 for the GPU
  seed: 0
  deterministic: true
  workers: 4
  optimizer: auto           # Ultralytics default (resolves to AdamW lr 0.002)
